; Strip rig: ESP32 dev board + LMP91000 breakout. See README.md for wiring.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I../common
	-Wall -Wextra
	; Pins and electrical assumptions; measure VDD and override VREF_MV.
	-DPIN_SDA=21
	-DPIN_SCL=22
	-DPIN_VOUT=34
	-DVREF_MV=3300
	; +1 if oxidation current raises VOUT above the internal zero; verify with a resistor.
	-DCURRENT_SIGN=1

; Host-side tests of the register encoders: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -I../common -Isrc -std=gnu++17
